<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#0B1528"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="1" stop-color="#0E172B"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7DA0C4"/>
    </pattern>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <ellipse cx="140" cy="50" rx="300" ry="200" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="500" rx="300" ry="180" fill="url(#glowViolet)"/>
  <rect width="1200" height="520" fill="url(#dots)" opacity="0.12"/>

  <!-- 标题 -->
  <g>
    <rect x="48" y="30" width="44" height="44" rx="13" fill="url(#logoGrad)"/>
    <path d="M70 39 C72 48 73.5 49.5 82 51.5 C73.5 53.5 72 55 70 64 C68 55 66.5 53.5 58 51.5 C66.5 49.5 68 48 70 39 Z" fill="#FFFFFF"/>
    <text x="104" y="57" font-size="27" font-weight="700" fill="#F8FAFC">完成情况闭环：各写各的，CEO 读全目录</text>
    <text x="105" y="80" font-size="12.5" fill="#93A5C4">员工只写自己那份 acceptance 文件，口头回复只用来通知</text>
  </g>

  <!-- 泳道 -->
  <text x="328" y="122" font-size="11" font-weight="600" fill="#6EE7B7" text-anchor="middle">员工（并行执行）</text>
  <text x="882" y="122" font-size="11" font-weight="600" fill="#7DD3FC" text-anchor="middle">CEO（收口）</text>
  <line x1="600" y1="112" x2="600" y2="330" stroke="#8FA3C4" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 5"/>

  <!-- 步骤 1 -->
  <rect x="46" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#34D399" stroke-opacity="0.33" stroke-width="1.1"/>
  <rect x="62" y="152" width="26" height="26" rx="8" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.35"/>
  <text x="75" y="170" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">1</text>
  <text x="62" y="204" font-size="12.5" font-weight="600" fill="#D1FAE5">员工执行</text>
  <text x="62" y="228" font-size="9.5" fill="#8FA3C4">只做自己白名单</text>
  <text x="62" y="243" font-size="9.5" fill="#8FA3C4">里的事，不改</text>
  <text x="62" y="258" font-size="9.5" fill="#8FA3C4">他人文件</text>

  <!-- 步骤 2 -->
  <rect x="234" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#34D399" stroke-opacity="0.33" stroke-width="1.1"/>
  <rect x="250" y="152" width="26" height="26" rx="8" fill="#34D399" fill-opacity="0.14" stroke="#34D399" stroke-opacity="0.35"/>
  <text x="263" y="170" font-size="12" font-weight="700" fill="#6EE7B7" text-anchor="middle">2</text>
  <text x="250" y="204" font-size="12.5" font-weight="600" fill="#D1FAE5">写自己那份</text>
  <text x="250" y="228" font-size="9.5" fill="#8FA3C4">acceptance/{员工}.md</text>
  <text x="250" y="243" font-size="9.5" fill="#8FA3C4">命令 / 退出码</text>
  <text x="250" y="258" font-size="9.5" fill="#8FA3C4">验证范围 / 风险</text>

  <!-- 步骤 3 -->
  <rect x="422" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1.1"/>
  <rect x="438" y="152" width="26" height="26" rx="8" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.38"/>
  <text x="451" y="170" font-size="12" font-weight="700" fill="#FDE68A" text-anchor="middle">3</text>
  <text x="438" y="204" font-size="12.5" font-weight="600" fill="#FDE68A">只回「已完成」</text>
  <text x="438" y="228" font-size="9.5" fill="#8FA3C4">不复述、不解释</text>
  <text x="438" y="243" font-size="9.5" fill="#8FA3C4">细节都在文件里</text>
  <text x="438" y="258" font-size="9.5" fill="#8FA3C4">CEO 自己去看</text>

  <!-- 步骤 4 -->
  <rect x="610" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.33" stroke-width="1.1"/>
  <rect x="626" y="152" width="26" height="26" rx="8" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.35"/>
  <text x="639" y="170" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">4</text>
  <text x="626" y="204" font-size="12.5" font-weight="600" fill="#E6F9FF">读整个目录</text>
  <text x="626" y="228" font-size="9.5" fill="#8FA3C4">一次读 acceptance/</text>
  <text x="626" y="243" font-size="9.5" fill="#8FA3C4">每份都核对</text>
  <text x="626" y="258" font-size="9.5" fill="#8FA3C4">真实产出</text>

  <!-- 步骤 5 -->
  <rect x="798" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.33" stroke-width="1.1"/>
  <rect x="814" y="152" width="26" height="26" rx="8" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.35"/>
  <text x="827" y="170" font-size="12" font-weight="700" fill="#7DD3FC" text-anchor="middle">5</text>
  <text x="814" y="204" font-size="12.5" font-weight="600" fill="#E6F9FF">全量验证</text>
  <text x="814" y="228" font-size="9.5" fill="#8FA3C4">构建 + 整体检查</text>
  <text x="814" y="243" font-size="9.5" fill="#8FA3C4">补跑「未验证」</text>
  <text x="814" y="258" font-size="9.5" fill="#8FA3C4">的部分</text>

  <!-- 步骤 6 -->
  <rect x="986" y="136" width="168" height="176" rx="14" fill="url(#cardFill)" stroke="#A78BFA" stroke-opacity="0.35" stroke-width="1.1"/>
  <rect x="1002" y="152" width="26" height="26" rx="8" fill="#A78BFA" fill-opacity="0.14" stroke="#A78BFA" stroke-opacity="0.38"/>
  <text x="1015" y="170" font-size="12" font-weight="700" fill="#C4B5FD" text-anchor="middle">6</text>
  <text x="1002" y="204" font-size="12.5" font-weight="600" fill="#EDE9FE">汇总两件事</text>
  <text x="1002" y="228" font-size="9.5" fill="#8FA3C4">完成情况 + 下一步</text>
  <text x="1002" y="243" font-size="9.5" fill="#8FA3C4">计划，写入</text>
  <text x="1002" y="258" font-size="9.5" fill="#8FA3C4">CEO-review.md</text>

  <!-- 箭头 -->
  <line x1="216" y1="214" x2="232" y2="214" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="404" y1="214" x2="420" y2="214" stroke="#FBBF24" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="592" y1="214" x2="608" y2="214" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <line x1="780" y1="214" x2="796" y2="214" stroke="#22D3EE" stroke-width="1.8" marker-end="url(#arrowCyan)"/>
  <line x1="968" y1="214" x2="984" y2="214" stroke="#A78BFA" stroke-width="1.8" marker-end="url(#arrowViolet)"/>

  <!-- 两条边界 -->
  <rect x="46" y="344" width="548" height="94" rx="14" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.25" stroke-width="1.1"/>
  <text x="70" y="370" font-size="12" font-weight="600" fill="#6EE7B7">员工边界</text>
  <text x="70" y="394" font-size="10" fill="#8FA3C4">只写自己那份完成情况，不读他人文件；只跑定向检查。</text>
  <text x="70" y="412" font-size="10" fill="#8FA3C4">不跑全仓库检查，不评判他人未完成的文件。</text>

  <rect x="606" y="344" width="548" height="94" rx="14" fill="#22D3EE" fill-opacity="0.05" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.1"/>
  <text x="630" y="370" font-size="12" font-weight="600" fill="#7DD3FC">CEO 边界</text>
  <text x="630" y="394" font-size="10" fill="#8FA3C4">收到「已完成」后一次读全 acceptance/，逐份核对真实产出；</text>
  <text x="630" y="412" font-size="10" fill="#8FA3C4">再跑全量构建与整体验证，不依赖员工自述。</text>

  <text x="600" y="480" font-size="11.5" fill="#8FA3C4" text-anchor="middle">文件按人分开写，目录一次读全；员工之间不互读、不互检，冲突由 CEO 统一裁决。</text>
</svg>
