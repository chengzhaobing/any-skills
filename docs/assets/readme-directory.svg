<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#0B1528"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="1" stop-color="#0E172B"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7DA0C4"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <ellipse cx="140" cy="50" rx="300" ry="200" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="540" rx="300" ry="180" fill="url(#glowViolet)"/>
  <rect width="1200" height="560" fill="url(#dots)" opacity="0.12"/>

  <!-- 标题 -->
  <g>
    <rect x="48" y="30" width="44" height="44" rx="13" fill="url(#logoGrad)"/>
    <path d="M70 39 C72 48 73.5 49.5 82 51.5 C73.5 53.5 72 55 70 64 C68 55 66.5 53.5 58 51.5 C66.5 49.5 68 48 70 39 Z" fill="#FFFFFF"/>
    <text x="104" y="57" font-size="27" font-weight="700" fill="#F8FAFC">一个任务一套文件，每人只读两份</text>
    <text x="105" y="80" font-size="12.5" fill="#93A5C4">main.md 负责分流；员工 md 各自独占；回执集中写进同一个文件</text>
  </g>

  <!-- 左：目录结构 -->
  <rect x="48" y="100" width="520" height="444" rx="18" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.2"/>
  <g>
    <rect x="76" y="118" width="30" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="76" y="144" font-size="13.5" font-weight="600" fill="#7DD3FC">目录结构</text>
    <text x="536" y="144" font-size="10.5" fill="#8FA3C4" text-anchor="end">复杂任务才建目录</text>

    <!-- 文件夹 -->
    <path d="M76 164 h10 l4 4 h12 v14 h-26 v-18 Z" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="106" y="178" font-size="13" font-weight="600" fill="#E2E8F0">multi-agent/</text>

    <line x1="88" y1="184" x2="88" y2="208" stroke="#8FA3C4" stroke-opacity="0.4" stroke-width="1.2"/>
    <path d="M96 208 h10 l4 4 h12 v14 h-26 v-18 Z" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="126" y="222" font-size="13" font-weight="600" fill="#C4B5FD">task-&lt;编号&gt;/</text>

    <!-- 树枝 -->
    <line x1="126" y1="236" x2="126" y2="464" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="261" x2="152" y2="261" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="311" x2="152" y2="311" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="361" x2="152" y2="361" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="411" x2="152" y2="411" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="464" x2="152" y2="464" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- main.md -->
    <rect x="152" y="240" width="384" height="42" rx="10" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.1"/>
    <rect x="152" y="240" width="4" height="42" rx="2" fill="#22D3EE" opacity="0.8"/>
    <text x="172" y="259" font-size="12.5" font-weight="600" fill="#E6F9FF">main.md</text>
    <text x="172" y="274" font-size="9.5" fill="#8FA3C4">共同必读：背景 · 目标 · 契约 · 通用规则 · 分流表</text>

    <!-- 员工 1-3 -->
    <rect x="152" y="290" width="384" height="42" rx="10" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="290" width="4" height="42" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="309" font-size="12.5" font-weight="600" fill="#D1FAE5">员工1.md</text>
    <text x="172" y="324" font-size="9.5" fill="#8FA3C4">个人任务书：文件白名单 · 锁定接口 · 验收要求</text>

    <rect x="152" y="340" width="384" height="42" rx="10" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="340" width="4" height="42" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="359" font-size="12.5" font-weight="600" fill="#D1FAE5">员工2.md</text>
    <text x="172" y="374" font-size="9.5" fill="#8FA3C4">同样的结构，不同的文件白名单与接口</text>

    <rect x="152" y="390" width="384" height="42" rx="10" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="390" width="4" height="42" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="409" font-size="12.5" font-weight="600" fill="#D1FAE5">员工3.md</text>
    <text x="172" y="424" font-size="9.5" fill="#8FA3C4">只建本次参与的员工，未参与的不建文件</text>

    <!-- Feedback -->
    <rect x="152" y="440" width="384" height="48" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.32" stroke-width="1.1"/>
    <rect x="152" y="440" width="4" height="48" rx="2" fill="#FBBF24" opacity="0.85"/>
    <text x="172" y="461" font-size="12.5" font-weight="600" fill="#FDE68A">Task &lt;编号&gt; Feedback.md</text>
    <text x="172" y="477" font-size="9.5" fill="#8FA3C4">共同回执：每人只写自己那一节，不碰他人小节</text>

    <!-- 图例 -->
    <circle cx="80" cy="518" r="4" fill="#22D3EE"/>
    <text x="92" y="522" font-size="9.5" fill="#8FA3C4">共同必读</text>
    <circle cx="172" cy="518" r="4" fill="#34D399"/>
    <text x="184" y="522" font-size="9.5" fill="#8FA3C4">个人任务</text>
    <circle cx="264" cy="518" r="4" fill="#FBBF24"/>
    <text x="276" y="522" font-size="9.5" fill="#8FA3C4">共同回执</text>
  </g>

  <!-- 右：读取路径 -->
  <rect x="600" y="100" width="552" height="444" rx="18" fill="url(#cardFill)" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="1.2"/>
  <g>
    <rect x="628" y="118" width="30" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="628" y="144" font-size="13.5" font-weight="600" fill="#C4B5FD">读取路径</text>
    <text x="1124" y="144" font-size="10.5" fill="#8FA3C4" text-anchor="end">只读两份，不越界</text>

    <!-- main -->
    <rect x="628" y="160" width="496" height="48" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.1"/>
    <text x="876" y="182" font-size="12.5" font-weight="600" fill="#E6F9FF" text-anchor="middle">main.md（共同必读）</text>
    <text x="876" y="198" font-size="9.5" fill="#8FA3C4" text-anchor="middle">分流表：每个人一行，指向自己的任务书</text>

    <!-- 分流总线 -->
    <line x1="876" y1="208" x2="876" y2="222" stroke="#22D3EE" stroke-width="1.6"/>
    <line x1="700" y1="222" x2="1052" y2="222" stroke="#22D3EE" stroke-width="1.6"/>
    <line x1="700" y1="222" x2="700" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
    <line x1="876" y1="222" x2="876" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
    <line x1="1052" y1="222" x2="1052" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>

    <!-- 员工 -->
    <rect x="632" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="700" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工1</text>
    <text x="700" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <rect x="808" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="876" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工2</text>
    <text x="876" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <rect x="984" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1052" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工3</text>
    <text x="1052" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <!-- 到自己的 md -->
    <line x1="700" y1="278" x2="700" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <line x1="876" y1="278" x2="876" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <line x1="1052" y1="278" x2="1052" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

    <rect x="632" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="700" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工1.md</text>
    <text x="700" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <rect x="808" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="876" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工2.md</text>
    <text x="876" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <rect x="984" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="1052" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工3.md</text>
    <text x="1052" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <!-- 禁止路径 -->
    <path d="M700 342 L700 368 L876 368 L876 342" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.75"/>
    <circle cx="788" cy="368" r="9" fill="#F87171" fill-opacity="0.15" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="788" y="372" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">✕</text>
    <text x="788" y="396" font-size="9.5" fill="#FCA5A5" text-anchor="middle">不读他人 md，也不改他人回执</text>

    <!-- 回执 -->
    <rect x="628" y="412" width="496" height="52" rx="12" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.32" stroke-width="1.1"/>
    <text x="876" y="434" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">回执：只写自己那节 → Task &lt;编号&gt; Feedback.md</text>
    <text x="876" y="450" font-size="9.5" fill="#8FA3C4" text-anchor="middle">写完重新读取确认已保存，对 CEO 只回「已完成」</text>

    <text x="876" y="492" font-size="10" fill="#8FA3C4" text-anchor="middle">读不到自己的文档就停下说明，不猜、不代替他人执行</text>
  </g>
</svg>
