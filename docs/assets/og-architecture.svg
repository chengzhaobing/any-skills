<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#0B1528"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="1" stop-color="#0E172B"/>
    </linearGradient>
    <linearGradient id="iconCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7DA0C4"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FBBF24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="150" cy="70" rx="320" ry="230" fill="url(#glowCyan)"/>
  <ellipse cx="1090" cy="580" rx="330" ry="240" fill="url(#glowViolet)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.14"/>

  <!-- 顶部标识 -->
  <g>
    <rect x="48" y="42" width="54" height="54" rx="16" fill="url(#logoGrad)"/>
    <path d="M75 53 C77.5 65.5 79.5 67.5 92 70 C79.5 72.5 77.5 74.5 75 87 C72.5 74.5 70.5 72.5 58 70 C70.5 67.5 72.5 65.5 75 53 Z" fill="#FFFFFF"/>
    <text x="120" y="80" font-size="36" font-weight="700" fill="#F8FAFC" letter-spacing="0.5">any-skills</text>
    <text x="121" y="106" font-size="14.5" fill="#93A5C4">把技能写成一段 Markdown，任何 AI 读完就能用</text>
    <rect x="974" y="54" width="178" height="32" rx="16" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.30"/>
    <text x="1063" y="76" font-size="11.5" fill="#7DD3FC" letter-spacing="0.8" text-anchor="middle">纯文本技能 · 零配置</text>
  </g>

  <!-- 节点 1：你 -->
  <g>
    <rect x="48" y="228" width="180" height="150" rx="18" fill="url(#cardFill)" stroke="#FBBF24" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect x="64" y="240" width="40" height="3" rx="1.5" fill="#FBBF24" opacity="0.9"/>
    <circle cx="88" cy="271" r="19" fill="#FBBF24" fill-opacity="0.14" stroke="#FBBF24" stroke-opacity="0.45"/>
    <circle cx="88" cy="265" r="5.5" fill="#FDE68A"/>
    <path d="M78 283 C78 275 83 271 88 271 C93 271 98 275 98 283" fill="#FDE68A"/>
    <text x="118" y="267" font-size="20" font-weight="600" fill="#FDE68A">你</text>
    <text x="118" y="287" font-size="11" fill="#8FA3C4">需求方</text>
    <line x1="64" y1="304" x2="212" y2="304" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="64" y="330" font-size="11.5" fill="#C7D3E6">说清目标与验收</text>
    <text x="64" y="352" font-size="11.5" fill="#C7D3E6">指明要用的技能</text>
  </g>

  <!-- 节点 2：AI 客户端 -->
  <g>
    <rect x="298" y="176" width="304" height="286" rx="22" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.40" stroke-width="1.2"/>
    <rect x="318" y="188" width="44" height="3" rx="1.5" fill="#22D3EE" opacity="0.9"/>
    <rect x="318" y="200" width="196" height="28" rx="14" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.30"/>
    <path d="M333 210 v-4 a4 4 0 0 1 8 0 v4" fill="none" stroke="#67E8F9" stroke-width="1.6"/>
    <rect x="331" y="210" width="12" height="9" rx="2" fill="#67E8F9" fill-opacity="0.9"/>
    <text x="351" y="219" font-size="11.5" fill="#67E8F9">官方账号 · 官方直连</text>
    <rect x="318" y="240" width="54" height="54" rx="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.45"/>
    <path d="M345 253 C347 263 349 265 359 268 C349 271 347 273 345 283 C343 273 341 271 331 268 C341 265 343 263 345 253 Z" fill="#A5F3FC"/>
    <text x="386" y="270" font-size="19" font-weight="600" fill="#E6F9FF">你的 AI 客户端</text>
    <text x="386" y="290" font-size="10.5" fill="#8FA3C4">用你已登录的官方账号</text>
    <g font-size="10.5">
      <rect x="318" y="302" width="42" height="22" rx="11" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.22"/>
      <text x="339" y="317" fill="#A5F3FC" text-anchor="middle">Trae</text>
      <rect x="366" y="302" width="78" height="22" rx="11" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.22"/>
      <text x="405" y="317" fill="#A5F3FC" text-anchor="middle">Claude Code</text>
      <rect x="450" y="302" width="48" height="22" rx="11" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.22"/>
      <text x="474" y="317" fill="#A5F3FC" text-anchor="middle">Codex</text>
      <rect x="504" y="302" width="56" height="22" rx="11" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.22"/>
      <text x="532" y="317" fill="#A5F3FC" text-anchor="middle">Cursor</text>
    </g>
    <line x1="318" y1="338" x2="582" y2="338" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="318" y="364" font-size="12" fill="#C7D3E6">① 拉取 skills/*.md（只读）</text>
    <text x="318" y="392" font-size="12" fill="#C7D3E6">② 按技能规则执行任务</text>
    <text x="318" y="420" font-size="12" fill="#C7D3E6">③ 结果写回你的项目</text>
    <text x="318" y="446" font-size="10.5" fill="#7F93B2">不改 base_url，不接管凭据</text>
  </g>

  <!-- 节点 3：GitHub -->
  <g>
    <rect x="702" y="150" width="450" height="132" rx="18" fill="url(#cardFill)" stroke="#34D399" stroke-opacity="0.40" stroke-width="1.2"/>
    <rect x="720" y="158" width="44" height="3" rx="1.5" fill="#34D399" opacity="0.9"/>
    <rect x="720" y="174" width="30" height="30" rx="9" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.40"/>
    <circle cx="730" cy="183" r="2.6" fill="#6EE7B7"/>
    <circle cx="736" cy="193" r="2.6" fill="#6EE7B7"/>
    <circle cx="730" cy="200" r="2.6" fill="#6EE7B7"/>
    <line x1="730" y1="185.6" x2="730" y2="197.4" stroke="#6EE7B7" stroke-width="1.4"/>
    <line x1="732.6" y1="183" x2="734" y2="190.4" stroke="#6EE7B7" stroke-width="1.4"/>
    <text x="760" y="194" font-size="17.5" font-weight="600" fill="#D1FAE5">GitHub · any-skills</text>
    <rect x="1066" y="170" width="68" height="24" rx="12" fill="#34D399" fill-opacity="0.10" stroke="#34D399" stroke-opacity="0.35"/>
    <text x="1100" y="186" font-size="10.5" fill="#6EE7B7" text-anchor="middle">只读</text>
    <line x1="720" y1="212" x2="1134" y2="212" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="720" y="224" width="12" height="15" rx="2.5" fill="none" stroke="#86EFAC" stroke-opacity="0.75"/>
    <text x="741" y="236" font-size="12" fill="#A7F3D0" font-family="'Consolas','Cascadia Code',monospace">skills/multi-agent.md</text>
    <text x="1134" y="236" font-size="9.5" fill="#7F93B2" text-anchor="end">raw.githubusercontent.com</text>
    <text x="741" y="258" font-size="11" fill="#9FB4CF">name + description + 规则正文</text>
  </g>

  <!-- 节点 4：本机执行 -->
  <g>
    <rect x="702" y="316" width="450" height="146" rx="18" fill="url(#cardFill)" stroke="#A78BFA" stroke-opacity="0.40" stroke-width="1.2"/>
    <rect x="720" y="324" width="44" height="3" rx="1.5" fill="#A78BFA" opacity="0.9"/>
    <rect x="720" y="340" width="30" height="30" rx="9" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.40"/>
    <rect x="728" y="347" width="14" height="17" rx="2.5" fill="none" stroke="#DDD6FE" stroke-opacity="0.85"/>
    <line x1="731" y1="352" x2="739" y2="352" stroke="#DDD6FE" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="731" y1="356" x2="739" y2="356" stroke="#DDD6FE" stroke-opacity="0.85" stroke-width="1.2"/>
    <line x1="731" y1="360" x2="736" y2="360" stroke="#DDD6FE" stroke-opacity="0.85" stroke-width="1.2"/>
    <text x="760" y="360" font-size="17.5" font-weight="600" fill="#EDE9FE">技能在本机执行</text>
    <line x1="720" y1="378" x2="1134" y2="378" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <text x="720" y="402" font-size="11.5" fill="#DDD6FE">读任务书 → 拆步骤 → 写文件 → 自检</text>
    <g font-size="10" font-family="'Consolas','Cascadia Code',monospace">
      <rect x="720" y="414" width="66" height="24" rx="7" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.28"/>
      <text x="753" y="430" fill="#C4B5FD" text-anchor="middle">main.md</text>
      <rect x="794" y="414" width="64" height="24" rx="7" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.28"/>
      <text x="826" y="430" fill="#C4B5FD" text-anchor="middle">trae1.md</text>
      <rect x="866" y="414" width="92" height="24" rx="7" fill="#A78BFA" fill-opacity="0.10" stroke="#A78BFA" stroke-opacity="0.28"/>
      <text x="912" y="430" fill="#C4B5FD" text-anchor="middle">Feedback.md</text>
    </g>
    <text x="720" y="455" font-size="10.5" fill="#8FA3C4">产物留在项目目录，不上传</text>
  </g>

  <!-- 流向 -->
  <g>
    <line x1="232" y1="304" x2="288" y2="304" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="260" y="291" font-size="10.5" fill="#FCD34D" text-anchor="middle">① 提出任务</text>

    <path d="M606 232 Q650 210 691 204" fill="none" stroke="#FBBF24" stroke-width="2" marker-end="url(#arrowAmber)"/>
    <text x="648" y="198" font-size="10.5" fill="#FCD34D" text-anchor="middle">拉取 .md</text>

    <path d="M691 250 Q650 262 611 270" fill="none" stroke="#34D399" stroke-width="2" marker-end="url(#arrowGreen)"/>
    <text x="650" y="285" font-size="10.5" fill="#6EE7B7" text-anchor="middle">技能文本</text>

    <line x1="606" y1="388" x2="691" y2="388" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowViolet)"/>
    <text x="649" y="375" font-size="10.5" fill="#C4B5FD" text-anchor="middle">按规则执行</text>
  </g>

  <!-- 底部机制条 -->
  <g>
    <rect x="48" y="494" width="1104" height="92" rx="20" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="72" y="527" font-size="11" fill="#8FA3C4" letter-spacing="1.2">机制上不制造封号风险的来源</text>
    <g font-size="12.5" fill="#C7D3E6">
      <circle cx="78" cy="557" r="7" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
      <path d="M74.5 557 L77 559.5 L81.5 554" fill="none" stroke="#6EE7B7" stroke-width="1.8"/>
      <text x="94" y="561">凭据只留在本机</text>

      <circle cx="324" cy="557" r="7" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
      <path d="M320.5 557 L323 559.5 L327.5 554" fill="none" stroke="#6EE7B7" stroke-width="1.8"/>
      <text x="340" y="561">不改 base_url / 客户端协议</text>

      <circle cx="622" cy="557" r="7" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
      <path d="M618.5 557 L621 559.5 L625.5 554" fill="none" stroke="#6EE7B7" stroke-width="1.8"/>
      <text x="638" y="561">不做多账号池轮换</text>

      <circle cx="862" cy="557" r="7" fill="#34D399" fill-opacity="0.16" stroke="#34D399" stroke-opacity="0.5"/>
      <path d="M858.5 557 L861 559.5 L865.5 554" fill="none" stroke="#6EE7B7" stroke-width="1.8"/>
      <text x="878" y="561">流量与身份直连官方</text>
    </g>
  </g>
</svg>
