<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#0B1528"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="1" stop-color="#0E172B"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7DA0C4"/>
    </pattern>
    <marker id="downCyan" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 0 L5 10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="downGreen" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 0 L5 10 Z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <ellipse cx="130" cy="40" rx="300" ry="190" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="500" rx="320" ry="200" fill="url(#glowGreen)"/>
  <rect width="1200" height="520" fill="url(#dots)" opacity="0.12"/>

  <!-- 标题 -->
  <g>
    <rect x="48" y="34" width="44" height="44" rx="13" fill="url(#logoGrad)"/>
    <path d="M70 43 C72 52 73.5 53.5 82 55.5 C73.5 57.5 72 59 70 68 C68 59 66.5 57.5 58 55.5 C66.5 53.5 68 52 70 43 Z" fill="#FFFFFF"/>
    <text x="104" y="59" font-size="27" font-weight="700" fill="#F8FAFC">两种加载路径</text>
    <text x="105" y="82" font-size="12.5" fill="#93A5C4">同一份 Markdown，在线读或本地放</text>
  </g>

  <!-- 在线读取 -->
  <g>
    <rect x="48" y="118" width="548" height="312" rx="20" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="68" y="136" width="34" height="3" rx="1.5" fill="#22D3EE" opacity="0.9"/>
    <rect x="68" y="148" width="32" height="32" rx="9" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.4"/>
    <path d="M80 160 h8 M80 164 h8 M80 168 h5" stroke="#A5F3FC" stroke-width="1.6" stroke-linecap="round"/>
    <text x="112" y="169" font-size="17.5" font-weight="600" fill="#E6F9FF">在线读取</text>
    <rect x="482" y="146" width="94" height="26" rx="13" fill="#22D3EE" fill-opacity="0.08" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="529" y="163" font-size="10.5" fill="#67E8F9" text-anchor="middle">给链接</text>
    <line x1="68" y1="190" x2="576" y2="190" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <rect x="68" y="200" width="480" height="48" rx="12" fill="#22D3EE" fill-opacity="0.05" stroke="#22D3EE" stroke-opacity="0.18"/>
    <circle cx="88" cy="224" r="4" fill="#22D3EE"/>
    <text x="104" y="229" font-size="13" fill="#C7E9F5">GitHub 上的 .md</text>
    <text x="528" y="228" font-size="10.5" fill="#67E8F9" text-anchor="end">最新版</text>

    <line x1="308" y1="248" x2="308" y2="260" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#downCyan)"/>

    <rect x="68" y="264" width="480" height="48" rx="12" fill="#22D3EE" fill-opacity="0.05" stroke="#22D3EE" stroke-opacity="0.18"/>
    <circle cx="88" cy="288" r="4" fill="#22D3EE"/>
    <text x="104" y="293" font-size="13" fill="#C7E9F5">AI 当场抓取全文</text>
    <text x="528" y="292" font-size="10.5" fill="#67E8F9" text-anchor="end">需联网</text>

    <line x1="308" y1="312" x2="308" y2="324" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#downCyan)"/>

    <rect x="68" y="328" width="480" height="48" rx="12" fill="#22D3EE" fill-opacity="0.05" stroke="#22D3EE" stroke-opacity="0.18"/>
    <circle cx="88" cy="352" r="4" fill="#22D3EE"/>
    <text x="104" y="357" font-size="13" fill="#C7E9F5">在客户端生效</text>
    <text x="528" y="356" font-size="10.5" fill="#67E8F9" text-anchor="end">零安装</text>

    <text x="68" y="404" font-size="11" fill="#8FA3C4">适合临时使用、跨客户端、想拿最新版</text>
  </g>

  <!-- 本地加载 -->
  <g>
    <rect x="604" y="118" width="548" height="312" rx="20" fill="url(#cardFill)" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.2"/>
    <rect x="624" y="136" width="34" height="3" rx="1.5" fill="#34D399" opacity="0.9"/>
    <rect x="624" y="148" width="32" height="32" rx="9" fill="#34D399" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.4"/>
    <path d="M636 160 h8 M636 164 h8 M636 168 h5" stroke="#6EE7B7" stroke-width="1.6" stroke-linecap="round"/>
    <text x="668" y="169" font-size="17.5" font-weight="600" fill="#D1FAE5">本地加载</text>
    <rect x="1038" y="146" width="94" height="26" rx="13" fill="#34D399" fill-opacity="0.08" stroke="#34D399" stroke-opacity="0.3"/>
    <text x="1085" y="163" font-size="10.5" fill="#6EE7B7" text-anchor="middle">放目录</text>
    <line x1="624" y1="190" x2="1132" y2="190" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <rect x="624" y="200" width="480" height="48" rx="12" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.18"/>
    <circle cx="644" cy="224" r="4" fill="#34D399"/>
    <text x="660" y="229" font-size="13" fill="#C7F0DE">skills/ 目录里的 .md</text>
    <text x="1084" y="228" font-size="10.5" fill="#6EE7B7" text-anchor="end">版本固定</text>

    <line x1="864" y1="248" x2="864" y2="260" stroke="#34D399" stroke-width="1.6" marker-end="url(#downGreen)"/>

    <rect x="624" y="264" width="480" height="48" rx="12" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.18"/>
    <circle cx="644" cy="288" r="4" fill="#34D399"/>
    <text x="660" y="293" font-size="13" fill="#C7F0DE">客户端启动时扫描</text>
    <text x="1084" y="292" font-size="10.5" fill="#6EE7B7" text-anchor="end">离线可用</text>

    <line x1="864" y1="312" x2="864" y2="324" stroke="#34D399" stroke-width="1.6" marker-end="url(#downGreen)"/>

    <rect x="624" y="328" width="480" height="48" rx="12" fill="#34D399" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.18"/>
    <circle cx="644" cy="352" r="4" fill="#34D399"/>
    <text x="660" y="357" font-size="13" fill="#C7F0DE">在客户端生效</text>
    <text x="1084" y="356" font-size="10.5" fill="#6EE7B7" text-anchor="end">需替换更新</text>

    <text x="624" y="404" font-size="11" fill="#8FA3C4">适合离线、长期固定版本</text>
  </g>

  <!-- 结论 -->
  <g>
    <rect x="48" y="454" width="1104" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="600" y="477" font-size="12" fill="#C7D3E6" text-anchor="middle">两种路径读的是同一份规则，差别只在获取时机、网络依赖与更新方式；换客户端不用改写技能。</text>
  </g>
</svg>
