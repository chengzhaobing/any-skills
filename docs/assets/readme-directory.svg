<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D1A"/>
      <stop offset="0.55" stop-color="#0B1528"/>
      <stop offset="1" stop-color="#0A1224"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223C"/>
      <stop offset="1" stop-color="#0E172B"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#7DA0C4"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <ellipse cx="140" cy="50" rx="300" ry="200" fill="url(#glowCyan)"/>
  <ellipse cx="1080" cy="580" rx="300" ry="180" fill="url(#glowViolet)"/>
  <rect width="1200" height="600" fill="url(#dots)" opacity="0.12"/>

  <!-- 标题 -->
  <g>
    <rect x="48" y="30" width="44" height="44" rx="13" fill="url(#logoGrad)"/>
    <path d="M70 39 C72 48 73.5 49.5 82 51.5 C73.5 53.5 72 55 70 64 C68 55 66.5 53.5 58 51.5 C66.5 49.5 68 48 70 39 Z" fill="#FFFFFF"/>
    <text x="104" y="57" font-size="27" font-weight="700" fill="#F8FAFC">一个任务一套文件，完成情况各写各的</text>
    <text x="105" y="80" font-size="12.5" fill="#93A5C4">main.md 负责分流；任务书各读各的；完成情况归各自，CEO 一次读全目录</text>
  </g>

  <!-- 左：目录结构 -->
  <rect x="48" y="100" width="520" height="484" rx="18" fill="url(#cardFill)" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="1.2"/>
  <g>
    <rect x="76" y="118" width="30" height="3" rx="1.5" fill="#22D3EE"/>
    <text x="76" y="144" font-size="13.5" font-weight="600" fill="#7DD3FC">目录结构</text>
    <text x="536" y="144" font-size="10.5" fill="#8FA3C4" text-anchor="end">复杂任务才建目录</text>

    <!-- 文件夹 -->
    <path d="M76 162 h10 l4 4 h12 v14 h-26 v-18 Z" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="106" y="176" font-size="13" font-weight="600" fill="#E2E8F0">multi-agent/</text>

    <line x1="88" y1="182" x2="88" y2="204" stroke="#8FA3C4" stroke-opacity="0.4" stroke-width="1.2"/>
    <path d="M96 204 h10 l4 4 h12 v14 h-26 v-18 Z" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="126" y="218" font-size="13" font-weight="600" fill="#C4B5FD">task-&lt;编号&gt;/</text>

    <!-- 树枝 -->
    <line x1="126" y1="232" x2="126" y2="416" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="250" x2="152" y2="250" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="292" x2="152" y2="292" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="334" x2="152" y2="334" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="376" x2="152" y2="376" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="136" y1="416" x2="152" y2="416" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>

    <!-- main.md -->
    <rect x="152" y="233" width="384" height="34" rx="9" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.1"/>
    <rect x="152" y="233" width="4" height="34" rx="2" fill="#22D3EE" opacity="0.8"/>
    <text x="172" y="254" font-size="11.5" fill="#E6F9FF"><tspan font-weight="600">main.md</tspan><tspan fill="#8FA3C4"> · 共同必读：背景 / 目标 / 契约 / 分流表</tspan></text>

    <!-- 员工任务书 -->
    <rect x="152" y="275" width="384" height="34" rx="9" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="275" width="4" height="34" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="296" font-size="11.5" fill="#D1FAE5"><tspan font-weight="600">员工1.md</tspan><tspan fill="#8FA3C4"> · 个人任务书：白名单 / 锁定接口 / 验收</tspan></text>

    <rect x="152" y="317" width="384" height="34" rx="9" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="317" width="4" height="34" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="338" font-size="11.5" fill="#D1FAE5"><tspan font-weight="600">员工2.md</tspan><tspan fill="#8FA3C4"> · 个人任务书：白名单 / 锁定接口 / 验收</tspan></text>

    <rect x="152" y="359" width="384" height="34" rx="9" fill="#34D399" fill-opacity="0.07" stroke="#34D399" stroke-opacity="0.3" stroke-width="1.1"/>
    <rect x="152" y="359" width="4" height="34" rx="2" fill="#34D399" opacity="0.8"/>
    <text x="172" y="380" font-size="11.5" fill="#D1FAE5"><tspan font-weight="600">员工3.md</tspan><tspan fill="#8FA3C4"> · 只建本次参与的员工</tspan></text>

    <!-- acceptance -->
    <path d="M152 402 h10 l4 4 h12 v14 h-26 v-18 Z" fill="#FBBF24" fill-opacity="0.16" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="0.8"/>
    <text x="180" y="416" font-size="12.5" font-weight="600" fill="#FDE68A">acceptance/</text>

    <line x1="176" y1="416" x2="176" y2="477" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="176" y1="437" x2="184" y2="437" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>
    <line x1="176" y1="477" x2="184" y2="477" stroke="#8FA3C4" stroke-opacity="0.35" stroke-width="1.2"/>

    <rect x="184" y="420" width="352" height="34" rx="9" fill="#FBBF24" fill-opacity="0.09" stroke="#FBBF24" stroke-opacity="0.34" stroke-width="1.1"/>
    <text x="200" y="441" font-size="11" fill="#FDE68A"><tspan font-weight="600">员工1.md ~ 员工3.md</tspan><tspan fill="#8FA3C4"> · 各自完成情况，只由本人写</tspan></text>

    <rect x="184" y="460" width="352" height="34" rx="9" fill="#A78BFA" fill-opacity="0.08" stroke="#A78BFA" stroke-opacity="0.3" stroke-width="1.1"/>
    <text x="200" y="481" font-size="11" fill="#EDE9FE"><tspan font-weight="600">CEO-review.md</tspan><tspan fill="#8FA3C4"> · 汇总与审查记录，员工不读写</tspan></text>

    <!-- 图例 -->
    <circle cx="80" cy="540" r="4" fill="#22D3EE"/>
    <text x="92" y="544" font-size="9.5" fill="#8FA3C4">共同必读</text>
    <circle cx="172" cy="540" r="4" fill="#34D399"/>
    <text x="184" y="544" font-size="9.5" fill="#8FA3C4">个人任务</text>
    <circle cx="264" cy="540" r="4" fill="#FBBF24"/>
    <text x="276" y="544" font-size="9.5" fill="#8FA3C4">个人完成情况</text>
    <circle cx="368" cy="540" r="4" fill="#A78BFA"/>
    <text x="380" y="544" font-size="9.5" fill="#8FA3C4">CEO 汇总</text>
  </g>

  <!-- 右：读取与写入路径 -->
  <rect x="600" y="100" width="552" height="484" rx="18" fill="url(#cardFill)" stroke="#A78BFA" stroke-opacity="0.22" stroke-width="1.2"/>
  <g>
    <rect x="628" y="118" width="30" height="3" rx="1.5" fill="#A78BFA"/>
    <text x="628" y="144" font-size="13.5" font-weight="600" fill="#C4B5FD">读取与写入路径</text>
    <text x="1124" y="144" font-size="10.5" fill="#8FA3C4" text-anchor="end">只读两份，只写一份</text>

    <!-- main -->
    <rect x="628" y="160" width="496" height="48" rx="12" fill="#22D3EE" fill-opacity="0.07" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.1"/>
    <text x="876" y="182" font-size="12.5" font-weight="600" fill="#E6F9FF" text-anchor="middle">main.md（共同必读）</text>
    <text x="876" y="198" font-size="9.5" fill="#8FA3C4" text-anchor="middle">分流表：每个人一行，指向任务书与完成情况文件</text>

    <!-- 分流总线 -->
    <line x1="876" y1="208" x2="876" y2="222" stroke="#22D3EE" stroke-width="1.6"/>
    <line x1="700" y1="222" x2="1052" y2="222" stroke="#22D3EE" stroke-width="1.6"/>
    <line x1="700" y1="222" x2="700" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
    <line x1="876" y1="222" x2="876" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>
    <line x1="1052" y1="222" x2="1052" y2="232" stroke="#22D3EE" stroke-width="1.6" marker-end="url(#arrowCyan)"/>

    <!-- 员工 -->
    <rect x="632" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="700" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工1</text>
    <text x="700" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <rect x="808" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="876" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工2</text>
    <text x="876" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <rect x="984" y="236" width="136" height="42" rx="10" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="1"/>
    <text x="1052" y="253" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">员工3</text>
    <text x="1052" y="268" font-size="9" fill="#8FA3C4" text-anchor="middle">找到自己那行</text>

    <!-- 到自己的任务书 -->
    <line x1="700" y1="278" x2="700" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <line x1="876" y1="278" x2="876" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
    <line x1="1052" y1="278" x2="1052" y2="298" stroke="#34D399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>

    <rect x="632" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="700" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工1.md</text>
    <text x="700" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <rect x="808" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="876" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工2.md</text>
    <text x="876" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <rect x="984" y="300" width="136" height="42" rx="10" fill="#34D399" fill-opacity="0.09" stroke="#34D399" stroke-opacity="0.38" stroke-width="1.1"/>
    <text x="1052" y="317" font-size="11.5" font-weight="600" fill="#D1FAE5" text-anchor="middle">员工3.md</text>
    <text x="1052" y="332" font-size="9" fill="#8FA3C4" text-anchor="middle">只读这一份</text>

    <!-- 禁止路径 -->
    <path d="M700 342 L700 368 L876 368 L876 342" fill="none" stroke="#F87171" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.75"/>
    <circle cx="788" cy="368" r="9" fill="#F87171" fill-opacity="0.15" stroke="#F87171" stroke-opacity="0.6" stroke-width="1.1"/>
    <text x="788" y="372" font-size="11" font-weight="700" fill="#FCA5A5" text-anchor="middle">✕</text>
    <text x="788" y="396" font-size="9.5" fill="#FCA5A5" text-anchor="middle">不读他人任务书，也不读他人完成情况</text>

    <!-- 完成情况写入 -->
    <rect x="628" y="408" width="496" height="48" rx="12" fill="#FBBF24" fill-opacity="0.07" stroke="#FBBF24" stroke-opacity="0.32" stroke-width="1.1"/>
    <text x="876" y="430" font-size="11.5" font-weight="600" fill="#FDE68A" text-anchor="middle">只写自己那份：acceptance/{与任务书同名}.md</text>
    <text x="876" y="446" font-size="9.5" fill="#8FA3C4" text-anchor="middle">写完回读确认已保存，对 CEO 只回「已完成」</text>

    <text x="876" y="482" font-size="10" fill="#8FA3C4" text-anchor="middle">CEO 一次读取整个 acceptance/ 目录，逐份核对并汇总</text>
    <text x="876" y="520" font-size="10" fill="#8FA3C4" text-anchor="middle">读不到该读的文档就停下说明，不猜、不替他人执行</text>
  </g>
</svg>
